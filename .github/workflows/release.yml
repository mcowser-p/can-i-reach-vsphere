---
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Pinned in package.json; Dependabot keeps the pins updated.
      - name: Install semantic-release toolchain
        run: npm install

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Consumers pin the module with `?ref=v1` — keep the floating major
      # tag on the latest release. semantic-release only manages vX.Y.Z.
      - name: Move the floating major tag
        run: |
          git fetch --tags --force
          new=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$new" ]; then
            echo "No release yet — nothing to move."
            exit 0
          fi
          major=${new%%.*}
          echo "Moving $major -> $new"
          git tag -f "$major" "$new^{commit}"
          git push --force origin "refs/tags/$major"
