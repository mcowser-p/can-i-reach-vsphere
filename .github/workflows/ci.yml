---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.5"
          tofu_wrapper: false

      - name: Format
        run: tofu fmt -check -recursive -diff

      # Every platform module must expose the same common inputs: that
      # is what makes them drop-in replacements for each other.
      - name: Drop-in contract (common.tf identical across platforms)
        run: |
          set -e
          ref=modules/vsphere/common.tf
          for f in modules/*/common.tf; do
            diff -u "$ref" "$f"
          done

      # Plan-only tests: cloud-init renders with no provider, the
      # platform modules run against mocked providers.
      - name: Validate and test every module
        run: |
          set -e
          for m in modules/cloud-init modules/verdict modules/vsphere modules/aws; do
            echo "== $m"
            (cd "$m" && tofu init -backend=false -input=false >/dev/null && tofu validate)
            if [ -d "$m/tests" ]; then (cd "$m" && tofu test); fi
          done

      - name: Validate the examples
        run: |
          set -e
          for e in examples/*/; do
            echo "== $e"
            (cd "$e" && tofu init -backend=false -input=false >/dev/null && tofu validate)
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint --strict .

      - name: shellcheck the guest scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./modules/cloud-init/scripts

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact
